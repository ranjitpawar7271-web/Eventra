{% extends 'base.html' %}
{% block title %}New Survey{% endblock %}
{% block content %}
<div class="container section-sm">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="glass-card p-4 p-md-5">
        <h3 class="mb-1"><i class="bi bi-clipboard2-check me-2 text-info"></i>New Survey</h3>
        <p class="text-muted-custom mb-4">for <strong>{{ event.title }}</strong></p>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Title</label>
            {{ form.title }}
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            {{ form.description }}
          </div>
          <div class="mb-4">
            <label class="form-label">Type</label>
            {{ form.survey_type }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">Create & Add Questions</button>
            <a href="{% url 'surveys:survey_list' event.slug %}" class="btn btn-outline-light px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
