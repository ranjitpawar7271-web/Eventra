{% extends 'base.html' %}
{% block title %}Workflow Settings{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 640px;">
  <a href="{% url 'workflow:approval_list' %}" class="text-muted small mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Back to approvals</a>
  <h2 class="fw-bold mb-4"><i class="bi bi-gear text-info me-2"></i>Workflow settings</h2>
  <div class="glass-card p-4">
    <form method="post">
      {% csrf_token %}
      <div class="form-check form-switch mb-3">
        {{ form.require_event_approval }}
        <label class="form-check-label ms-2" for="{{ form.require_event_approval.id_for_label }}">
          Require approval before an event can be published
        </label>
      </div>
      <p class="text-muted small">{{ form.require_event_approval.help_text }}</p>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
