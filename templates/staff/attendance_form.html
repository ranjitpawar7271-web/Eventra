{% extends 'base.html' %}
{% block title %}Mark Attendance{% endblock %}
{% block content %}
<div class="container section-sm">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="glass-card p-4 p-md-5">
        <h3 class="mb-4"><i class="bi bi-clock-history me-2 text-info"></i>Attendance — {{ profile.user.username }}</h3>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Date</label>
              {{ form.date }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              {{ form.status }}
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Check In</label>
              {{ form.check_in }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Check Out</label>
              {{ form.check_out }}
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Notes</label>
            {{ form.notes }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-2"></i>Save</button>
            <a href="{% url 'staff:staff_detail' profile.pk %}" class="btn btn-outline-light px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
