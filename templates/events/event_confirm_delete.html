{% extends 'base.html' %}
{% block title %}Delete Event{% endblock %}
{% block content %}
<div class="container section-sm">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="glass-card p-4 p-md-5 text-center">
        <div class="icon-tile icon-tile-danger mx-auto mb-3"><i class="bi bi-exclamation-triangle"></i></div>
        <h3 class="mb-2">Delete "{{ event.title }}"?</h3>
        <p class="text-muted-custom mb-4">This action cannot be undone. All registrations for this event will also be removed.</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-2"></i>Yes, Delete</button>
          <a href="{{ event.get_absolute_url }}" class="btn btn-outline-light px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
