{% extends 'base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card text-center">
    <div class="icon-tile mx-auto text-success-custom"><i class="bi bi-envelope-check"></i></div>
    <h2 class="auth-title">Check Your Email</h2>
    <p class="auth-subtitle">We've emailed instructions for resetting your password, if an account exists with that email.</p>
    <a href="{% url 'users:login' %}" class="btn btn-primary w-100 py-2">Back to Login</a>
  </div>
</div>
{% endblock %}
