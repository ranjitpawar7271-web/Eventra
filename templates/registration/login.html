{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center">
      <div class="icon-tile mx-auto"><i class="bi bi-box-arrow-in-right"></i></div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Login to manage your events and registrations.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-floating mb-3">
        <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required autofocus>
        <label for="id_username"><i class="bi bi-person me-1"></i> Username</label>
      </div>
      <div class="form-floating mb-2">
        <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
        <label for="id_password"><i class="bi bi-lock me-1"></i> Password</label>
      </div>
      <div class="d-flex justify-content-end mb-3">
        <a href="{% url 'users:password_reset' %}" class="small">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
    </form>
    <p class="auth-footer-text">Don't have an account? <a href="{% url 'users:signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
