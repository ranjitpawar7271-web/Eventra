{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card text-center">
    <div class="icon-tile mx-auto text-success-custom"><i class="bi bi-check-circle"></i></div>
    <h2 class="auth-title">Password Reset Complete</h2>
    <p class="auth-subtitle">Your password has been changed successfully. You can now log in.</p>
    <a href="{% url 'users:login' %}" class="btn btn-primary w-100 py-2">Login</a>
  </div>
</div>
{% endblock %}
